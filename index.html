<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild - ブラウザゲーム</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen active">
            <div class="title-content">
                <h1 class="game-title">Guild</h1>
                <p class="game-subtitle">ブラウザゲーム</p>
                
                <!-- メニューボタン -->
                <div class="menu-buttons">
                    <button class="menu-btn" data-page="adventure">
                        <span class="icon">🗡️</span>
                        <span class="label">冒険</span>
                    </button>
                    <button class="menu-btn" data-page="guild">
                        <span class="icon">🏰</span>
                        <span class="label">ギルド</span>
                    </button>
                    <button class="menu-btn" data-page="shop">
                        <span class="icon">🛒</span>
                        <span class="label">お店</span>
                    </button>
                    <button class="menu-btn" data-page="story">
                        <span class="icon">📖</span>
                        <span class="label">物語</span>
                    </button>
                    <button class="menu-btn" data-page="special">
                        <span class="icon">⭐</span>
                        <span class="label">★</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- コンテンツ領域 -->
        <div id="content-area" class="content-area">
            <!-- 冒険ページ -->
            <div id="page-adventure" class="page-content">
                <div class="page-header">
                    <button class="back-btn" onclick="backToTitle()">← 戻る</button>
                    <h2>冒険</h2>
                </div>
                <div class="page-body">
                    <p>ここは冒険ページです。</p>
                    <p>冒険に出かけて、経験を積みましょう！</p>
                </div>
            </div>

            <!-- ギルドページ -->
            <div id="page-guild" class="page-content">
                <div class="page-header">
                    <button class="back-btn" onclick="backToTitle()">← 戻る</button>
                    <h2>ギルド</h2>
                </div>
                <div class="guild-main-menu">
                    <button class="guild-menu-btn" onclick="guildUI.switchGuildView('composition')">
                        <span class="icon">🎯</span>
                        <span class="label">編成</span>
                    </button>
                    <button class="guild-menu-btn" onclick="guildUI.switchGuildView('recruit')">
                        <span class="icon">➕</span>
                        <span class="label">雇用</span>
                    </button>
                    <button class="guild-menu-btn" onclick="guildUI.switchGuildView('job_change')">
                        <span class="icon">🔄</span>
                        <span class="label">転職</span>
                    </button>
                    <button class="guild-menu-btn" onclick="guildUI.switchGuildView('equipment')">
                        <span class="icon">⚔️</span>
                        <span class="label">装備</span>
                    </button>
                    <button class="guild-menu-btn" onclick="guildUI.switchGuildView('dismiss')">
                        <span class="icon">❌</span>
                        <span class="label">解雇</span>
                    </button>
                </div>
                <div class="page-body" id="guild-content">
                    <!-- ギルド画面のコンテンツ -->
                </div>
            </div>

            <!-- お店ページ -->
            <div id="page-shop" class="page-content">
                <div class="page-header">
                    <button class="back-btn" onclick="backToTitle()">← 戻る</button>
                    <h2>お店</h2>
                </div>
                <div class="page-body">
                    <p>ここはお店ページです。</p>
                    <p>アイテムを購入しましょう！</p>
                </div>
            </div>

            <!-- 物語ページ -->
            <div id="page-story" class="page-content">
                <div class="page-header">
                    <button class="back-btn" onclick="backToTitle()">← 戻る</button>
                    <h2>物語</h2>
                </div>
                <div class="page-body">
                    <p>ここは物語ページです。</p>
                    <p>ゲームの背景にある物語を知りましょう！</p>
                </div>
            </div>

            <!-- 特別ページ (★) - マスターデータ編集 -->
            <div id="page-special" class="page-content">
                <div class="page-header">
                    <button class="back-btn" onclick="backToTitle()">← 戻る</button>
                    <h2>★ マスターデータ管理</h2>
                </div>
                <div class="master-data-menu">
                    <button class="master-menu-btn" onclick="masterDataManager.switchView('races')">
                        <span class="icon">👥</span>
                        <span class="label">種族</span>
                    </button>
                    <button class="master-menu-btn" onclick="masterDataManager.switchView('jobs')">
                        <span class="icon">💼</span>
                        <span class="label">職業</span>
                    </button>
                    <button class="master-menu-btn" onclick="masterDataManager.switchView('personalities')">
                        <span class="icon">💫</span>
                        <span class="label">個性</span>
                    </button>
                    <button class="master-menu-btn" onclick="masterDataManager.switchView('tactics')">
                        <span class="icon">🎲</span>
                        <span class="label">戦術</span>
                    </button>
                    <button class="master-menu-btn" onclick="masterDataManager.switchView('skills')">
                        <span class="icon">✨</span>
                        <span class="label">スキル</span>
                    </button>
                    <button class="master-menu-btn" onclick="masterDataManager.switchView('equipment')">
                        <span class="icon">🛡️</span>
                        <span class="label">装備</span>
                    </button>
                </div>
                <div class="page-body" id="master-data-content">
                    <!-- マスターデータ編集画面 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Guild System Scripts -->
    <script src="js/guild/guild-constants.js"></script>
    <script src="js/guild/growth-curves.js"></script>
    <script src="js/guild/skill-system.js"></script>
    <script src="js/guild/equipment-system.js"></script>
    <script src="js/guild/character-model.js"></script>
    <script src="js/guild/guild-data.js"></script>
    <script src="js/guild/guild-ui.js"></script>
    <script src="js/guild/master-data-manager.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
